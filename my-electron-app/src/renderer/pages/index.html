<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>What are we eating today?</title>
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body class="crt">
    <div class="title-bar">
      <div class="window-buttons">
        <button id="close">x</button>
        <button id="minimize">–</button>
      </div>
      <img src="../assets/images/lanterns.png" id="lanterns">
      <img src="../assets/images/frame.png" id="main-screen-frame">
    </div>
    <div class="window">
      <aside class="sidebar">
        <img src="../assets/svg/Menu.svg" id="menu-svg">
        <div class="menu">
          <button id="homeButton">home</button>
          <button id="historyButton">history</button>
          <button id="preferencesButton">preferences</button>
        </div>
        <div id="main-screen-menu-line"></div>
      </aside>

      <main class="main-content">
        <div id="main-card">
          <h1>What are we eating?</h1>
        </div>
        <button class="pick-button" id="pickButton">pick my meal ✦</button>
      </main>
    </div>
    <script src="../scripts/navigation.js"></script>
    <script src="../scripts/windowControls.js"></script>
  </body>
</html>
