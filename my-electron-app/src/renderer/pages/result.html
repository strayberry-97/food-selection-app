<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>What are we eating today?</title>
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body class="crt">
    <div class="title-bar">
      <div class="window-buttons">
        <button id="close">x</button>
        <button id="minimize">–</button>
      </div>
      <img src="../assets/images/flowers-1.png" id="flowers-1">
      <img src="../assets/images/flowers-2.png" id="flowers-2">
    </div>
    <div class="window">
      <aside class="sidebar">
        <img src="../assets/svg/Menu.svg" id="menu-svg">
        <div class="menu">
          <button id="homeButton">home</button>
          <button id="historyButton">history</button>
          <button id="preferencesButton">preferences</button>
        </div>
        <div id="main-screen-menu-line"></div>
      </aside>
      <div id="result-content">
        <main id="result-main-content">
            <img src="../assets/svg/Your fate is_.svg" id="fate">
            <span id="meal-name">chicken burger</span>
            from
            <span id="restaurant-name">mcdonald's</span>
            
        </main>
        <div id="result-buttons">
            <button >accept</button>
            <button id="openPopup">decline</button>
        </div>
      </div>
      
    </div>
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup">
            <h1>Tell us what's wrong</h1>
            <select>
                <option>Just don't want it</option>
                <option>Too costly</option>
                <option>Had similar option recently</option>
                <option>Another reason</option>
            </select>
            <button id="closePopup">submit</button>
        </div>
    </div>
    <script type="module" src="../scripts/history.js"></script>
    <script src="../scripts/navigation.js"></script>
    <script src="../scripts/windowControls.js"></script>
    <script src="../scripts/popup.js"></script>
    <script src="../scripts/recommendations.js"></script>
  </body>
</html>
